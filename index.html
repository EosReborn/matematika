<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<title>Számolás gyakorló</title>
<style>
  :root { --bg:#fff8e7; --card:#fff; --ink:#2b2b3a; --accent:#ff7a3d; --ok:#2eaa5b; --bad:#e04848; --soft:#ffe3cf; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; justify-content:center; padding:16px; padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right)); padding-bottom:max(16px,env(safe-area-inset-bottom)); }
  main { width:100%; max-width:520px; }
  @media (min-width:700px) { main { max-width:680px; } body { font-size:1.15rem; } .q { font-size:3.4rem !important; } h1 { font-size:2.3rem !important; } }
  h1 { text-align:center; font-size:1.8rem; margin:8px 0 16px; }
  .card { background:var(--card); border-radius:20px; padding:20px; box-shadow:0 4px 14px rgba(0,0,0,.08); margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:1.1rem; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .modes { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .modes button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:1rem; line-height:1.15; }
  .modes button b { font-size:1.4rem; }
  input[type=number] { -moz-appearance:textfield; appearance:textfield; } input::-webkit-outer-spin-button,input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .opts { display:grid; gap:8px; }
  .opts button { display:flex; align-items:center; gap:10px; text-align:left; font-size:1rem; padding:10px 12px; }
  .opts button::before { content:"○"; font-size:1.3rem; }
  .opts button.sel::before { content:"✔"; }
  .opts button:disabled { opacity:.4; cursor:not-allowed; }
  .hint { font-size:.85rem; margin:8px 2px 14px; color:#777; }
  .q { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; }
  @media (max-width:420px) { .q { font-size:2rem !important; gap:6px; } .q input { width:3.4ch !important; } }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .pad button { font-size:1.6rem; font-weight:bold; padding:10px 0; min-height:56px; }
  .pad .fn { background:#eee; border-color:#eee; }
  @media (max-height:700px) { .pad button { min-height:46px; padding:6px 0; } }
  button { touch-action:manipulation; min-height:48px; font:inherit; cursor:pointer; border:2px solid var(--soft); background:var(--soft); color:var(--ink); border-radius:14px; padding:12px 4px; font-size:1.1rem; }
  button.sel { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:bold; }
  button.go { width:100%; background:var(--ok); border-color:var(--ok); color:#fff; font-size:1.3rem; font-weight:bold; padding:14px; }
  .hidden { display:none; }
  .top { display:flex; justify-content:space-between; font-size:1rem; margin-bottom:8px; }
  .bar { height:10px; background:var(--soft); border-radius:6px; overflow:hidden; margin-bottom:18px; }
  .bar div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  .q { font-size:2.6rem; font-weight:bold; margin:10px 0 18px; }
  .q input { width:5.2ch; font:inherit; text-align:center; border:3px solid var(--accent); border-radius:12px; padding:4px; }
  .msg { text-align:center; min-height:2em; font-size:1.2rem; font-weight:bold; margin-bottom:10px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .big { text-align:center; font-size:3rem; margin:8px 0; }
  .center { text-align:center; }
  .back { background:none; border:none; text-decoration:underline; font-size:.95rem; padding:4px; }
</style>
</head>
<body>
<main>
  <h1>🧮 Számolás gyakorló</h1>

  <section id="setup" class="card">
    <h2>1. Mit gyakorolsz?</h2>
    <div class="modes" id="modes">
      <button data-m="+" class="sel"><b>➕</b>Összeadás</button>
      <button data-m="-"><b>➖</b>Kivonás</button>
      <button data-m="*"><b>🔀</b>Vegyes</button>
    </div>
    <h2 style="margin-top:20px">2. Meddig számolsz?</h2>
    <div class="grid" id="limits"></div>
    <h2 style="margin-top:20px">3. Hány feladat?</h2>
    <div class="modes" id="counts">
      <button data-c="10" class="sel">10</button>
      <button data-c="20">20</button>
      <button data-c="30">30</button>
    </div>
    <h2 style="margin-top:20px">4. Extrák <small style="font-weight:normal">(bekapcsolható)</small></h2>
    <div class="opts" id="opts">
      <button data-o="cross">🔟 Tízesátlépés (pl. 8 + 5, 23 − 8)</button>
      <button data-o="missing">❓ Hiányzó szám (pl. 7 + ? = 15)</button>
      <button data-o="timer">⏱️ Időmérés</button>
    </div>
    <p class="hint" id="crosshint">A tízesátlépés a 20-as számkörtől érhető el.</p>
    <button class="go" id="start">Indulhat! 🚀</button>
  </section>

  <section id="game" class="card hidden">
    <div class="top"><span id="info"></span><span id="time"></span><span id="score"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="q"><span id="qpre"></span><input id="ans" type="text" inputmode="none" readonly autocomplete="off" maxlength="3"><span id="qpost"></span></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad"></div>
    <button class="go" id="check">Ellenőrzés</button>
    <p class="center"><button class="back" id="quit">← Vissza a menübe</button></p>
  </section>

  <section id="result" class="card hidden center">
    <div class="big" id="stars"></div>
    <h2 id="rtext"></h2>
    <p id="rsub"></p>
    <button class="go hidden" id="retry" style="background:var(--accent);border-color:var(--accent);margin-bottom:10px"></button>
    <button class="go" id="again">Még egyszer</button>
    <p><button class="back" id="menu">← Menü</button></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = '+', limit = 10, total = 10;
const opts = { cross:false, missing:false, timer:false };
let t0 = 0, timerId = null, retryRound = false;
let questions = [], idx = 0, correct = 0, tries = 0, locked = false;

// határ gombok: 10, 20, ... 100
for (let n = 10; n <= 100; n += 10) {
  const b = document.createElement('button');
  b.textContent = n; b.dataset.l = n;
  if (n === 10) b.classList.add('sel');
  $('limits').appendChild(b);
}
function pick(container, attr, cb) {
  container.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    container.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); cb(b.dataset[attr]);
  });
}
pick($('modes'), 'm', v => mode = v);
function syncCross() {
  const b = document.querySelector('[data-o=cross]');
  b.disabled = limit < 20;
  $('crosshint').style.display = limit < 20 ? '' : 'none';
}
pick($('limits'), 'l', v => { limit = +v; syncCross(); });
$('opts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  b.classList.toggle('sel'); opts[b.dataset.o] = b.classList.contains('sel');
});
syncCross();
pick($('counts'), 'c', v => total = +v);

const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

function makeQuestion() {
  const op = mode === '*' ? (Math.random() < .5 ? '+' : '-') : mode;
  const cross = opts.cross && limit >= 20;
  let a, b, c, n = 0;
  if (op === '+') {
    do { a = rnd(0, limit); b = rnd(0, limit - a); n++; }
    while (cross && n < 500 && (a % 10) + (b % 10) < 10);
    c = a + b;
  } else {
    do { a = rnd(0, limit); b = rnd(0, a); n++; }
    while (cross && n < 500 && (a % 10) >= (b % 10));
    c = a - b;
  }
  const sign = op === '+' ? '+' : '−';
  if (!opts.missing) return { pre: `${a} ${sign} ${b} =`, post: '', answer: c };
  if (Math.random() < .5) return { pre: `${a} ${sign}`, post: `= ${c}`, answer: b };
  return { pre: '', post: `${sign} ${b} = ${c}`, answer: a };
}
function makeSet() {
  const seen = new Set(), list = [];
  let guard = 0;
  while (list.length < total && guard++ < 1000) {
    const q = makeQuestion();
    const key = q.pre + '|' + q.post + '|' + q.answer;
    if (seen.has(key) && guard < 500) continue;
    seen.add(key); list.push(q);
  }
  return list;
}

function show(id) { ['setup', 'game', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

const fmt = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function tick() { $('time').textContent = '⏱️ ' + fmt(Date.now() - t0); }
function start() { begin(makeSet(), false); }
function begin(list, isRetry) {
  questions = list; idx = 0; correct = 0; retryRound = isRetry;
  show('game');
  $('time').style.display = opts.timer ? '' : 'none';
  clearInterval(timerId);
  if (opts.timer) { t0 = Date.now(); tick(); timerId = setInterval(tick, 500); }
  next();
}
function next() {
  if (idx >= questions.length) return finish();
  tries = 0; locked = false;
  $('qpre').textContent = questions[idx].pre; $('qpost').textContent = questions[idx].post;
  $('ans').value = ''; $('msg').textContent = ''; $('msg').className = 'msg';
  $('info').textContent = (retryRound ? '🔁 ' : '') + `${idx + 1}. feladat / ${questions.length}`;
  $('score').textContent = `⭐ ${correct}`;
  $('prog').style.width = (idx / questions.length * 100) + '%';
  $('check').textContent = 'Ellenőrzés';
  
}
function check() {
  if (locked) { idx++; return next(); }
  const v = $('ans').value;
  if (v === '') return;
  const q = questions[idx];
  if (+v === q.answer) {
    if (tries === 0) correct++;
    $('msg').textContent = ['Szuper! 🎉', 'Ügyes vagy! 👏', 'Helyes! ✅', 'Remek! 🌟'][rnd(0, 3)];
    $('msg').className = 'msg ok';
    locked = true; $('check').textContent = 'Következő →';
  } else {
    tries++; q.missed = true;
    if (tries >= 2) {
      $('msg').textContent = `A helyes válasz: ${q.answer}`;
      $('msg').className = 'msg bad';
      locked = true; $('check').textContent = 'Következő →';
    } else {
      $('msg').textContent = 'Nem egészen, próbáld újra! 🤔';
      $('msg').className = 'msg bad';
      $('ans').value = '';
    }
  }
  $('score').textContent = `⭐ ${correct}`;
}
function finish() {
  clearInterval(timerId);
  show('result');
  const pct = correct / questions.length;
  $('stars').textContent = pct >= .9 ? '🏆⭐⭐⭐' : pct >= .7 ? '⭐⭐' : pct >= .4 ? '⭐' : '💪';
  $('rtext').textContent = `${correct} / ${questions.length} elsőre jó`;
  $('rsub').textContent = pct >= .9 ? 'Fantasztikus!' : pct >= .7 ? 'Nagyon ügyes!' : 'Gyakorolj még egy kicsit, menni fog!';
  const missed = questions.filter(q => q.missed);
  $('retry').classList.toggle('hidden', !missed.length);
  $('retry').textContent = `🔁 Hibás feladatok újra (${missed.length})`;
  $('retry').onclick = () => begin(missed.map(q => ({ pre: q.pre, post: q.post, answer: q.answer })), true);
  if (!missed.length) $('rsub').textContent += retryRound ? ' Minden hibát kijavítottál! 🎯' : ' Hibátlan kör! 🎯';
  if (opts.timer) $('rsub').textContent += ` ⏱️ Időd: ${fmt(Date.now() - t0)}`;
}

$('start').onclick = start;
$('check').onclick = check;
$('again').onclick = start;
$('menu').onclick = $('quit').onclick = () => { clearInterval(timerId); show('setup'); };
// saját számbillentyűzet (nem takarja el a képernyőt telefonon/tableten)
['1','2','3','4','5','6','7','8','9','⌫','0','C'].forEach(k => {
  const b = document.createElement('button');
  b.textContent = k; if (k === '⌫' || k === 'C') b.className = 'fn';
  b.onclick = () => press(k);
  $('pad').appendChild(b);
});
function press(k) {
  if (locked) return;
  const a = $('ans');
  if (k === '⌫') a.value = a.value.slice(0, -1);
  else if (k === 'C') a.value = '';
  else if (a.value.length < 3) a.value += k;
}
// fizikai billentyűzet (gép)
document.addEventListener('keydown', e => {
  if ($('game').classList.contains('hidden')) return;
  if (e.key === 'Enter') check();
  else if (/^\d$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('⌫');
});
</script>
</body>
</html>
